name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          cp dir-backup dist/dir-backup
          # Inject the git tag as VERSION so `dir-backup --version` matches
          # the release the user installed. GITHUB_REF_NAME is e.g. "v1.5.0";
          # we strip the leading "v" to follow common --version conventions.
          sed -i "s/__VERSION__/${GITHUB_REF_NAME#v}/" dist/dir-backup
          chmod +x dist/dir-backup

          tar -C dist -czf "dir-backup_${GITHUB_REF_NAME}_linux_amd64.tar.gz" dir-backup
          tar -C dist -czf "dir-backup_${GITHUB_REF_NAME}_linux_arm64.tar.gz" dir-backup

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dir-backup_${{ github.ref_name }}_linux_amd64.tar.gz
            dir-backup_${{ github.ref_name }}_linux_arm64.tar.gz
